// Optional physical-device suite. Installs a separate application ID; never accesses the user's library.
gradle.afterProject { project, state ->
    if (project.path == ':app') {
        project.android.defaultConfig.applicationId = 'cz.jan.conversationreader.quality'
        project.android.defaultConfig.testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        project.android.sourceSets.getByName('androidTest').java.srcDir(new File(project.rootDir, 'audit/device-tests'))
        project.dependencies.add('androidTestImplementation', 'androidx.test:runner:1.7.0')
        project.dependencies.add('androidTestImplementation', 'androidx.test.ext:junit:1.3.0')
        project.dependencies.add('androidTestImplementation', 'androidx.test:core-ktx:1.7.0')
        project.dependencies.add('androidTestImplementation', project.dependencies.platform('androidx.compose:compose-bom:2025.09.01'))
        project.dependencies.add('androidTestImplementation', 'androidx.compose.ui:ui-test-junit4')
    }
}
